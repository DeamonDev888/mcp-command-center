[package]
name = "mcp-command-center-desktop"
version = "0.7.11"
edition = "2021"
description = "MCP Command Center — fenêtre native OS"

[[bin]]
name = "mcp-command-center-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
mcp-command-center = { path = ".." }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
