[package]
name = "mcp-control-desktop"
version = "0.7.15"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "MCP Control — fenêtre native OS"

[[bin]]
name = "mcp-control-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
mcp-control = { path = ".." }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
