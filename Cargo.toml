[workspace]
resolver = "2"
members = [".", "desktop"]

[package]
name = "mcp-control"
version = "0.7.14"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
serde_json = "1"
# Gateway MCP : la console elle-même devient un serveur MCP (POST /mcp sur le
# port UI) — dispatch MCP 2026-07-28 embarqué (ServerCore::dispatch), catalogues
# dynamiques. Sans features optionnelles : serde + serde_json seulement.
litemcp = "0.9"

[[bin]]
name = "mcp-control"
path = "src/main.rs"

[lib]
name = "mcp_control"
path = "src/lib.rs"

[profile.release]
opt-level = 2
