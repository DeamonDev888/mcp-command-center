name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# contenu write réservé au job release — build/desktop n'en ont pas besoin
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: mcp-control-linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: mcp-control-windows-x86_64
          # macOS : un seul livrable universel — les deux architectures sont
          # compilées puis fusionnées avec lipo en un binaire qui tourne natif
          # sur Intel ET Apple Silicon (macOS choisit la bonne au lancement).
          - os: macos-latest
            target: universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            artifact: mcp-control-macos-universal
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (épinglé SHA — supply-chain)

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable (épinglé SHA)
        with:
          toolchain: stable
          targets: ${{ matrix.rust_targets || matrix.target }}

      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2 (épinglé SHA)
        with:
          key: ${{ matrix.target }}

      - name: Tests
        run: cargo test --release -p mcp-control

      - name: Clippy (strict, tous les targets)
        run: cargo clippy --release -p mcp-control --all-targets -- -D warnings

      - name: Build
        shell: bash
        run: |
          if [ -n "${{ matrix.rust_targets }}" ]; then
            # cible universelle : compiler chaque architecture (lipo fusionne ensuite)
            for t in $(echo "${{ matrix.rust_targets }}" | tr ',' ' '); do
              cargo build --release -p mcp-control --target "$t"
            done
          else
            cargo build --release -p mcp-control --target ${{ matrix.target }}
          fi

      - name: Collecter le binaire
        shell: bash
        run: |
          EXT=""
          case "${{ matrix.target }}" in
            *windows*) EXT=".exe" ;;
          esac
          FILE="${{ matrix.artifact }}${EXT}"
          if [ -n "${{ matrix.rust_targets }}" ]; then
            # fusion des deux architectures en un binaire universel
            lipo -create -output "$FILE" \
              target/aarch64-apple-darwin/release/mcp-control \
              target/x86_64-apple-darwin/release/mcp-control
            lipo -info "$FILE"
          else
            cp "target/${{ matrix.target }}/release/mcp-control${EXT}" "$FILE"
          fi
          echo "FILE=$FILE" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 (épinglé SHA)
        with:
          name: ${{ matrix.artifact }}
          path: ${{ env.FILE }}
          if-no-files-found: error

  desktop:
    name: desktop ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: mcp-control-desktop-windows-x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: mcp-control-desktop-linux-x86_64
          # macOS : un seul livrable universel (voir le job build)
          - os: macos-latest
            target: universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            artifact: mcp-control-desktop-macos-universal
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (épinglé SHA)

      - name: Dépendances système (Linux — WebKitGTK)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev libgtk-3-dev

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable (épinglé SHA)
        with:
          toolchain: stable
          targets: ${{ matrix.rust_targets || matrix.target }}

      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2 (épinglé SHA)
        with:
          key: desktop-${{ matrix.target }}

      - name: Build (Tauri / webview système)
        shell: bash
        run: |
          if [ -n "${{ matrix.rust_targets }}" ]; then
            # cible universelle : compiler chaque architecture (lipo fusionne ensuite)
            for t in $(echo "${{ matrix.rust_targets }}" | tr ',' ' '); do
              cargo build --release -p mcp-control-desktop --target "$t"
            done
          else
            cargo build --release -p mcp-control-desktop --target ${{ matrix.target }}
          fi

      # Installateur Windows (wizard NSIS : langue, dossier, raccourcis).
      # `tauri build` réutilise le binaire déjà compilé et n'ajoute que le bundle.
      - name: CLI Tauri (Windows — installateur NSIS)
        if: runner.os == 'Windows'
        run: npm install --global @tauri-apps/cli@^2

      - name: Installateur NSIS (Windows — wizard)
        if: runner.os == 'Windows'
        working-directory: desktop
        shell: bash
        run: npx tauri build --bundles nsis --target ${{ matrix.target }}

      - name: Collecter le binaire
        shell: bash
        run: |
          EXT=""
          case "${{ matrix.target }}" in
            *windows*) EXT=".exe" ;;
          esac
          FILE="${{ matrix.artifact }}${EXT}"
          if [ -n "${{ matrix.rust_targets }}" ]; then
            # fusion des deux architectures en un binaire universel
            lipo -create -output "$FILE" \
              target/aarch64-apple-darwin/release/mcp-control-desktop \
              target/x86_64-apple-darwin/release/mcp-control-desktop
            lipo -info "$FILE"
          else
            cp "target/${{ matrix.target }}/release/mcp-control-desktop${EXT}" "$FILE"
          fi
          echo "FILE=$FILE" >> "$GITHUB_ENV"
          # installateur wizard NSIS (Windows uniquement)
          SETUP=$(ls "target/${{ matrix.target }}/release/bundle/nsis/"*-setup.exe 2>/dev/null | head -1 || true)
          if [ -n "$SETUP" ]; then
            cp "$SETUP" "${{ matrix.artifact }}-setup.exe"
            echo "SETUP=${{ matrix.artifact }}-setup.exe" >> "$GITHUB_ENV"
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 (épinglé SHA)
        with:
          name: ${{ matrix.artifact }}
          # l'artefact Windows contient le binaire ET l'installateur wizard
          path: |
            ${{ env.FILE }}
            ${{ env.SETUP }}
          if-no-files-found: warn

  release:
    needs: [build, desktop]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write # seule étape qui crée la release GitHub
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (épinglé SHA)

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4 (épinglé SHA)
        with:
          merge-multiple: true
          path: dist

      - name: Extraire les notes du CHANGELOG
        run: python3 scripts/extract_notes.py > notes.md

      - name: Organiser les téléchargements par OS
        run: |
          cat >> notes.md <<'MDEOF'

          ---

          ## 📦 Téléchargements par OS

          ### 🪟 Windows
          | Fichier | Quoi |
          |---|---|
          | `mcp-control-desktop-windows-x86_64-setup.exe` | **L'app avec fenêtre — installateur recommandé** (wizard : langue, dossier, raccourcis) |
          | `mcp-control-windows-x86_64.exe` | Moteur headless (console, sans fenêtre — serveurs/scripts) |

          ### 🍎 macOS
          | Fichier | Quoi |
          |---|---|
          | `mcp-control-desktop-macos-universal` | **L'app avec fenêtre — binaire universel : Mac Intel ET Apple Silicon (M1→M4)** |
          | `mcp-control-macos-universal` | Moteur headless (console) — même binaire universel |

          ### 🐧 Linux (x86_64)
          | Fichier | Quoi |
          |---|---|
          | `mcp-control-desktop-linux-x86_64` | **L'app avec fenêtre** (webview WebKitGTK du système) |
          | `mcp-control-linux-x86_64` | Moteur headless (console — idéal VPS/SSH) |

          Après téléchargement sur macOS/Linux : `chmod +x <fichier>` puis `./<fichier>`.
          Premier lancement macOS : clic droit sur le fichier → **Ouvrir** si Gatekeeper s'en mêle.
          MDEOF

      - name: Créer la release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2 (épinglé SHA)
        with:
          name: ${{ github.ref_name }}
          body_path: notes.md
          files: dist/*
