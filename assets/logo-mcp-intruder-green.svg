<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="MCP Intruder Logo">
  <defs>
    <linearGradient id="logo-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#030805"/>
      <stop offset="50%" stop-color="#07130c"/>
      <stop offset="100%" stop-color="#040b07"/>
    </linearGradient>

    <radialGradient id="hot-green" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00ff9d" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#00ff9d" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#00ff9d" stop-opacity="0"/>
    </radialGradient>

    <filter id="glow-green" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glow-cyan" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="32" fill="url(#logo-bg)"/>
  <circle cx="256" cy="256" r="230" fill="url(#hot-green)"/>

  <!-- Centered Logo Scaled Up (512x512 canvas) -->
  <g transform="translate(256 256) scale(4.4) translate(-50 -50)" filter="url(#glow-green)">
    <!-- Outer Precision Corner Brackets -->
    <path d="M 8 22 L 8 8 L 22 8" fill="none" stroke="#00ff9d" stroke-width="1.8" opacity="0.85"/>
    <path d="M 78 8 L 92 8 L 92 22" fill="none" stroke="#00ff9d" stroke-width="1.8" opacity="0.85"/>
    <path d="M 8 78 L 8 92 L 22 92" fill="none" stroke="#00ff9d" stroke-width="1.8" opacity="0.85"/>
    <path d="M 92 78 L 92 92 L 78 92" fill="none" stroke="#00ff9d" stroke-width="1.8" opacity="0.85"/>

    <!-- Outer Reticle System -->
    <circle cx="50" cy="50" r="46" fill="none" stroke="#00ff9d" stroke-width="2.2" stroke-dasharray="64 8 64 8"/>
    <circle cx="50" cy="50" r="38" fill="none" stroke="#00ff9d" stroke-width="1" opacity="0.45" stroke-dasharray="3 4"/>
    <circle cx="50" cy="50" r="28" fill="#00ff9d" fill-opacity="0.06" stroke="#00e5ff" stroke-width="0.8" opacity="0.55"/>

    <!-- Crosshair Calibration Axis -->
    <g stroke="#00ff9d" stroke-width="2.6" stroke-linecap="round">
      <line x1="50" y1="0" x2="50" y2="12"/>
      <line x1="50" y1="88" x2="50" y2="100"/>
      <line x1="0" y1="50" x2="12" y2="50"/>
      <line x1="88" y1="50" x2="100" y2="50"/>
    </g>

    <!-- 45-Degree Telemetry Ticks -->
    <g stroke="#00ff9d" stroke-width="1.3" opacity="0.6" stroke-linecap="round">
      <line x1="19" y1="19" x2="25" y2="25"/>
      <line x1="81" y1="19" x2="75" y2="25"/>
      <line x1="19" y1="81" x2="25" y2="75"/>
      <line x1="81" y1="81" x2="75" y2="75"/>
    </g>

    <!-- MCP Protocol Hexagonal Node Core -->
    <polygon points="50,18 78,34 78,66 50,82 22,66 22,34" fill="#040e08" stroke="#00ff9d" stroke-width="1.8" stroke-linejoin="round"/>
    
    <!-- Protocol Bus Lines Radiating Outward -->
    <g stroke="#00e5ff" stroke-width="1.1" opacity="0.75">
      <line x1="50" y1="18" x2="50" y2="12"/>
      <line x1="78" y1="34" x2="88" y2="28"/>
      <line x1="78" y1="66" x2="88" y2="72"/>
      <line x1="50" y1="82" x2="50" y2="88"/>
      <line x1="22" y1="66" x2="12" y2="72"/>
      <line x1="22" y1="34" x2="12" y2="28"/>
    </g>
    <!-- Solder Micro-Nodes -->
    <circle cx="50" cy="18" r="1.8" fill="#00e5ff"/>
    <circle cx="78" cy="34" r="1.8" fill="#00e5ff"/>
    <circle cx="78" cy="66" r="1.8" fill="#00e5ff"/>
    <circle cx="50" cy="82" r="1.8" fill="#00e5ff"/>
    <circle cx="22" cy="66" r="1.8" fill="#00e5ff"/>
    <circle cx="22" cy="34" r="1.8" fill="#00e5ff"/>

    <!-- Central Intruder Stealth Mask / Kali Crest -->
    <path d="M 50 24 L 68 33 L 64 54 L 50 70 L 36 54 L 32 33 Z" fill="#020805" stroke="#00ff9d" stroke-width="2.2" stroke-linejoin="round"/>
    <!-- Facet Cheek & Brow Bevels -->
    <path d="M 32 33 L 42 47 L 50 70 L 58 47 L 68 33" fill="none" stroke="#00ff9d" stroke-width="1.2" opacity="0.65" stroke-linejoin="round"/>
    <line x1="42" y1="47" x2="58" y2="47" stroke="#00ff9d" stroke-width="1.2" opacity="0.5"/>

    <!-- Glowing Cyber Visor (Intense Dual Optics) -->
    <polygon points="38,41 47,43 46,46 39,45" fill="#00e5ff" filter="url(#glow-cyan)"/>
    <polygon points="62,41 53,43 54,46 61,45" fill="#00e5ff" filter="url(#glow-cyan)"/>

    <!-- MCP-Auto-Jailbreak Lightning Breach Core -->
    <path d="M 50 20 L 52 34 L 47 37 L 53 46 L 46 55 L 52 55 L 50 77" fill="none" stroke="#00ff9d" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="miter"/>

    <!-- Focal Laser Target Lock Reticle -->
    <circle cx="50" cy="50" r="2.2" fill="#00e5ff" filter="url(#glow-cyan)"/>
  </g>
</svg>